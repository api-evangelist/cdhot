name: cdhot (Hot New Energy Technology)
description: cdhot (Hot New Energy Technology) is a Chinese industrial energy-efficiency
  company listed in the Qiming Venture Partners portfolio. Qiming describes the company
  as providing EPC (engineering, procurement and construction) and EMC (energy management
  contracting) services to industrial customers to achieve waste heat recovery — capturing
  surplus process heat from industrial operations and converting it into reusable
  energy. The company is an engineering and energy-services business rather than a
  software or API provider. As of the July 2026 enrichment pass its published website
  at cdhot.cc did not resolve over HTTPS, redirected to www.cdhot.cc over HTTP and
  returned an empty HTTP 404, and no developer portal, documentation, specification,
  or API surface of any kind could be found.
